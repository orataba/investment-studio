services:
  postgres:
    image: postgres:17
    container_name: investment-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment_studio
      POSTGRES_USER: investment_studio
      POSTGRES_PASSWORD: investment_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - investment-studio-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  investment-studio-postgres-data:

services:
  postgres:
    image: postgres:17
    container_name: portfolio-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_ops
      POSTGRES_USER: portfolio_ops
      POSTGRES_PASSWORD: portfolio_ops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - portfolio-ops-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  portfolio-ops-postgres-data:

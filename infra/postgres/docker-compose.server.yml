name: portfolio-operations-workbench

services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: portfolio-ops-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: portfolio_ops
      POSTGRES_USER: portfolio_ops
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - portfolio-ops-postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_ops -d portfolio_ops"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  portfolio-ops-postgres-data:
    name: portfolio-ops-postgres-data-v1

secrets:
  postgres_password:
    file: ${PORTFOLIO_OPS_POSTGRES_PASSWORD_FILE:?set PORTFOLIO_OPS_POSTGRES_PASSWORD_FILE}

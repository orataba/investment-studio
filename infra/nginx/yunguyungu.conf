server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name regime.yunguyungu.com;

    ssl_certificate /etc/letsencrypt/live/yunguyungu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunguyungu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /_yungu_auth {
        internal;
        proxy_pass http://127.0.0.1:8102/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 https://yunguyungu.com/login?next=$scheme://$host$request_uri;
    }

    location @api_unauthorized {
        return 401;
    }

    # UI assets are published with Studio; signal APIs use the independent release.
    location = / {
        auth_request /_yungu_auth;
        error_page 401 = @login_redirect;
        root /opt/investment-studio/current/deploy/regime-ui;
        try_files /index.html =404;
        expires -1;
    }

    location = /audit {
        auth_request /_yungu_auth;
        error_page 401 = @login_redirect;
        root /opt/investment-studio/current/deploy/regime-ui;
        try_files /audit.html =404;
        expires -1;
    }

    location ^~ /static/ {
        auth_request /_yungu_auth;
        error_page 401 = @login_redirect;
        alias /opt/investment-studio/current/deploy/regime-ui/;
        expires 1m;
    }

    location ^~ /api/ {
        auth_request /_yungu_auth;
        error_page 401 = @api_unauthorized;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }

    location / {
        auth_request /_yungu_auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
}

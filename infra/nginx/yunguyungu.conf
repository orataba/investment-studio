limit_req_zone $binary_remote_addr zone=yungu_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yunguyungu.com watchlist.yunguyungu.com portfolio.yunguyungu.com regime.yunguyungu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yunguyungu.com;

    ssl_certificate /etc/letsencrypt/live/yunguyungu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunguyungu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /_yungu_auth {
        internal;
        proxy_pass http://127.0.0.1:8102/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @login_redirect {
        return 302 https://yunguyungu.com/login?next=$scheme://$host$request_uri;
    }

    location @api_unauthorized {
        return 401;
    }

    location = /login {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
    }

    location = /api/auth/login {
        limit_req zone=yungu_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8102/api/auth/login;
        include /etc/nginx/proxy_params;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        auth_request /_yungu_auth;
        error_page 401 = @api_unauthorized;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }

    location = /instruments { return 404; }
    location = /database-dashboard { return 404; }
    location = /data { return 404; }

    location / {
        auth_request /_yungu_auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
}


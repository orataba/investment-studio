[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-data"
version = "1.2.4"
description = "Private CLI data ingestion and maintenance; no HTTP service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "exchange-calendars>=4.13,<5.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "requests>=2.32,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "httpx2>=2.5,<3.0",
]

[tool.setuptools.packages.find]
include = ["studio_data*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "postgresql_integration: exercises PostgreSQL-only migration and constraint behavior",
]

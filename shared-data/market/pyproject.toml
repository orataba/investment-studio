[project]
name = "investment-studio-market"
version = "1.2.7"
description = "Investment Studio shared numerical and text evidence data"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.14,<2",
  "duckdb>=1.4,<2", "pyarrow>=18", "curl-cffi>=0.13,<1", "pytz>=2024",
  "requests>=2.32,<3",
  "mcp>=2.0,<3.0", "httpx2>=2.5,<3.0", "jsonschema>=4.26,<5.0",
  "exchange-calendars>=4.13,<5.0",
  "openpyxl>=3.1,<4",
]

[project.scripts]
studio-market = "studio_market.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgresql_integration: isolated PostgreSQL publication and migration contracts"]

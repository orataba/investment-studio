[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-identity"
version = "1.2.0"
description = "Shared client for Investment Studio account and execution identities"
requires-python = ">=3.12"
dependencies = ["urllib3>=2.7,<3.0"]

[tool.setuptools.packages.find]
include = ["studio_identity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

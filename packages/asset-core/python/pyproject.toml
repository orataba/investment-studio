[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yungu-asset-core"
version = "0.1.0"
description = "Shared asset core contracts for Yungu"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["yungu_asset_core*"]

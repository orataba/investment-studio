[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-ops-calculation-core"
version = "0.1.0"
description = "Shared calculation registry contracts for Portfolio Operations Workbench"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["portfolio_ops_calculation_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -m 'not postgresql_integration'"
markers = [
  "postgresql_integration: requires an explicitly enabled disposable PostgreSQL database",
]

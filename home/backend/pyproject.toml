[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-home"
version = "0.1.0"
description = "Investment Studio login and navigation homepage"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "httpx2>=2.5,<3.0"]

[tool.setuptools.packages.find]
include = ["home_api*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

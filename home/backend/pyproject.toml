[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-home"
version = "1.2.0"
description = "Investment Studio login and navigation homepage"
requires-python = ">=3.12"
dependencies = [
  "investment-studio-identity>=0.1.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.scripts]
studio-identity = "home_api.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "httpx2>=2.5,<3.0"]

[tool.setuptools.packages.find]
include = ["home_api*"]

[tool.uv.sources]
investment-studio-identity = { path = "../../packages/identity" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["postgresql_integration: requires an explicit disposable PostgreSQL test target"]

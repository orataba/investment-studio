name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-tests:
    name: Application and repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version-file: uv.toml
          enable-cache: true
          cache-dependency-glob: requirements/python.lock

      - name: Synchronize locked Python environment
        run: infra/scripts/sync_python_env.sh

      - name: Run static repository checks
        run: infra/scripts/verify_repository.sh static

      - name: Run backend suites
        run: infra/scripts/verify_repository.sh backend all

      - name: Run infrastructure suites
        run: infra/scripts/verify_repository.sh infra portable

  frontend-tests:
    name: Frontend tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            home/frontend/package-lock.json
            apps/portfolio/frontend/package-lock.json
            apps/watchlist/frontend/package-lock.json
            apps/briefing/frontend/package-lock.json
            shared-data/instruments/ts/package-lock.json

      - name: Install locked frontend dependencies
        run: |
          npm --prefix home/frontend ci
          npm --prefix apps/portfolio/frontend ci
          npm --prefix apps/watchlist/frontend ci
          npm --prefix apps/briefing/frontend ci
          npm --prefix shared-data/instruments/ts ci

      - name: Run frontend suites and production builds
        run: infra/scripts/verify_repository.sh frontend all

  postgresql-tests:
    name: PostgreSQL migrations and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUNBUFFERED: "1"
      PGPASSFILE: /tmp/investment-studio.pgpass
      INVESTMENT_STUDIO_TEST_POSTGRES_URL: postgresql+psycopg://investment_studio_test@127.0.0.1:5432/investment_studio_test_admin
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version-file: uv.toml
          enable-cache: true
          cache-dependency-glob: requirements/python.lock

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: ${architecture}" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/psql --version | grep -Eq 'PostgreSQL\) 17\.'
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Synchronize locked Python environment
        run: infra/scripts/sync_python_env.sh

      - name: Create isolated CI roles and migration database
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE investment_studio
            LOGIN NOCREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'investment_studio';
          CREATE ROLE investment_studio_test
            LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'investment_studio_test';
          SQL
          createdb --host 127.0.0.1 --username postgres \
            --owner investment_studio investment_studio_ci
          createdb --host 127.0.0.1 --username postgres \
            --owner investment_studio_test investment_studio_test_admin
          install -m 600 /dev/null "$PGPASSFILE"
          printf '%s\n' \
            '127.0.0.1:5432:*:postgres:postgres' \
            '127.0.0.1:5432:*:investment_studio:investment_studio' \
            '127.0.0.1:5432:*:investment_studio_test:investment_studio_test' \
            > "$PGPASSFILE"

      - name: Upgrade every migration chain to head
        env:
          INVESTMENT_STUDIO_HOME_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_MIGRATION_EXPECTED_DATABASE: investment_studio_ci
          INVESTMENT_STUDIO_INSTRUMENT_DATA_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_INSTRUMENT_DATA_ALEMBIC_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_INSTRUMENT_DATA_SCHEMA: instrument_data
          INVESTMENT_STUDIO_DATA_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_DATA_ALEMBIC_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_DATA_DATABASE_SCHEMA: instrument_data
          INVESTMENT_STUDIO_DATA_OPERATIONS_DATABASE_SCHEMA: data_ingestion
          INVESTMENT_STUDIO_PORTFOLIO_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_PORTFOLIO_ALEMBIC_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_PORTFOLIO_DATABASE_SCHEMA: portfolio
          INVESTMENT_STUDIO_WATCHLIST_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_WATCHLIST_ALEMBIC_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_WATCHLIST_DATABASE_SCHEMA: watchlist
          INVESTMENT_STUDIO_MARKET_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_BRIEFING_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
          INVESTMENT_STUDIO_BRIEFING_ALEMBIC_DATABASE_URL: postgresql+psycopg://investment_studio@127.0.0.1:5432/investment_studio_ci
        run: infra/scripts/verify_repository.sh migration-heads

      - name: Run PostgreSQL integration suites with zero skips
        run: infra/scripts/verify_repository.sh postgres-integration all

      - name: Run PostgreSQL infrastructure suites
        env:
          INVESTMENT_STUDIO_TEST_DB_HOST: 127.0.0.1
          INVESTMENT_STUDIO_TEST_DB_PORT: "5432"
          INVESTMENT_STUDIO_TEST_DB_USER: postgres
          INVESTMENT_STUDIO_TEST_DB_PASSWORD: postgres
        run: infra/scripts/verify_repository.sh infra postgresql

  quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - application-tests
      - frontend-tests
      - postgresql-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI area to pass
        env:
          APPLICATION_RESULT: ${{ needs.application-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql-tests.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$POSTGRESQL_RESULT" = success

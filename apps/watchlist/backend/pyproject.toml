[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-watchlist-backend"
version = "1.2.6"
description = "Investment Studio Watchlist backend"
requires-python = ">=3.12"
dependencies = [
  "investment-studio-runtime>=1.2.0",
  "mcp>=2.0,<3.0",
  "pypdf>=5,<7",
  "alembic>=1.16,<2.0",
  "exchange-calendars>=4.13,<5.0",
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "httpx2>=2.5,<3.0",
]

[tool.setuptools.packages.find]
include = ["watchlist_app*", "watchlist_migration_snapshots*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "postgresql_integration: exercises PostgreSQL-only schema and constraint behavior",
]

[tool.uv.sources]
investment-studio-runtime = { path = "../../../packages/runtime" }

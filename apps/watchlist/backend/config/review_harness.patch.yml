# Layered on the research-only sector preset. A reviewer cannot generate new
# evidence or mutate research: its connector reads the fixed packet and exact
# retained quant input paths through the authorized run's read API.
- id: mcp-watchlist-research
  disabled: true
- id: system-prompt
  config:
    persona: !!js process.env.INVESTMENT_STUDIO_REVIEW_INSTRUCTIONS
- insert:
    - id: mcp-watchlist-review
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: review
        transport: stdio
        command: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PROJECT_ROOT + '/.venv/bin/python'
        args: ['-m', 'watchlist_app.review_mcp']
        cwd: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PROJECT_ROOT + '/apps/watchlist/backend'
        env:
          INVESTMENT_STUDIO_REVIEW_PACKET: !!js process.env.INVESTMENT_STUDIO_REVIEW_PACKET
          INVESTMENT_STUDIO_REVIEW_RESULT: !!js process.env.INVESTMENT_STUDIO_REVIEW_RESULT
          INVESTMENT_STUDIO_REVIEW_READS: !!js process.env.INVESTMENT_STUDIO_REVIEW_READS
          INVESTMENT_STUDIO_RESEARCH_RUN_ID: !!js process.env.INVESTMENT_STUDIO_RESEARCH_RUN_ID
          INVESTMENT_STUDIO_RESEARCH_API_BASE_URL: !!js process.env.INVESTMENT_STUDIO_RESEARCH_API_BASE_URL
          INVESTMENT_STUDIO_RESEARCH_RUN_TOKEN: !!js process.env.INVESTMENT_STUDIO_RESEARCH_RUN_TOKEN
        toolCallTimeoutMs: 180000
        failOnStartupError: true

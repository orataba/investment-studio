- insert:
    - id: mcp-watchlist-research
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: research
        transport: stdio
        command: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PROJECT_ROOT + '/.venv/bin/python'
        args: ['-m', 'watchlist_app.research_mcp']
        cwd: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PROJECT_ROOT + '/apps/watchlist/backend'
        env:
          INVESTMENT_STUDIO_RESEARCH_API_BASE_URL: !!js process.env.INVESTMENT_STUDIO_RESEARCH_API_BASE_URL
          INVESTMENT_STUDIO_RESEARCH_RUN_ID: !!js process.env.INVESTMENT_STUDIO_RESEARCH_RUN_ID
          INVESTMENT_STUDIO_RESEARCH_RUN_TOKEN: !!js process.env.INVESTMENT_STUDIO_RESEARCH_RUN_TOKEN
          INVESTMENT_STUDIO_PORTFOLIO_COPILOT_MODEL_NAME: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_MODEL_NAME || 'deepseek-v4.1-flash'
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY
          DEEPSEEK_BASE_URL: !!js process.env.DEEPSEEK_BASE_URL || 'https://gateway.hzxxf.cn/v1'
          DEEPSEEK_SEARCH_URL: !!js process.env.DEEPSEEK_SEARCH_URL || ''
        toolCallTimeoutMs: 60000
        failOnStartupError: true

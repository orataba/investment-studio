# DeepSeek conversation agent with Watchlist research tools.

- id: agent-default-model
  config:
    provider: studio-deepseek
    model: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_MODEL_NAME || 'deepseek-v4-pro'

- id: system-prompt
  config:
    persona: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PERSONA

- id: session-title-llm
  disabled: true
- id: code-runtime
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: mcp-watchlist-research
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: research
        transport: stdio
        command: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PROJECT_ROOT + '/.venv/bin/python'
        args: ['-m', 'watchlist_app.research_mcp']
        cwd: !!js process.env.INVESTMENT_STUDIO_RESEARCH_PROJECT_ROOT + '/apps/watchlist/backend'
        env:
          INVESTMENT_STUDIO_RESEARCH_API_BASE_URL: !!js process.env.INVESTMENT_STUDIO_RESEARCH_API_BASE_URL
          INVESTMENT_STUDIO_RESEARCH_RUN_ID: !!js process.env.INVESTMENT_STUDIO_RESEARCH_RUN_ID
          INVESTMENT_STUDIO_RESEARCH_RUN_TOKEN: !!js process.env.INVESTMENT_STUDIO_RESEARCH_RUN_TOKEN
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY
          DEEPSEEK_BASE_URL: !!js process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com'
          DEEPSEEK_SEARCH_URL: !!js process.env.DEEPSEEK_SEARCH_URL || ''
        toolCallTimeoutMs: 180000
        failOnStartupError: true

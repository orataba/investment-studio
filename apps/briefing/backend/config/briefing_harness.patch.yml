- insert:
    - id: mcp-studio-briefing
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: briefing
        transport: stdio
        command: !!js process.env.INVESTMENT_STUDIO_BRIEFING_PROJECT_ROOT + '/.venv/bin/python'
        args: ['-m', 'briefing_app.mcp']
        cwd: !!js process.env.INVESTMENT_STUDIO_BRIEFING_PROJECT_ROOT + '/apps/briefing/backend'
        env:
          INVESTMENT_STUDIO_BRIEFING_API_BASE_URL: !!js process.env.INVESTMENT_STUDIO_BRIEFING_API_BASE_URL
          INVESTMENT_STUDIO_BRIEFING_REPORT_ID: !!js process.env.INVESTMENT_STUDIO_BRIEFING_REPORT_ID
          INVESTMENT_STUDIO_BRIEFING_RUN_TOKEN: !!js process.env.INVESTMENT_STUDIO_BRIEFING_RUN_TOKEN
          INVESTMENT_STUDIO_BRIEFING_HARNESS_MODE: !!js process.env.INVESTMENT_STUDIO_BRIEFING_HARNESS_MODE
        toolCallTimeoutMs: 60000
        failOnStartupError: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-briefing-backend"
version = "1.1.0"
description = "Investment Studio market briefings"
requires-python = ">=3.12"
dependencies = ["alembic>=1.16,<2", "fastapi>=0.115,<1", "mcp>=2,<3", "pydantic-settings>=2.10,<3", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2,<3", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.5,<3"]

[project.scripts]
studio-briefing = "briefing_app.cli:main"

[tool.setuptools.packages.find]
include = ["briefing_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgresql_integration: isolated PostgreSQL migration contracts"]

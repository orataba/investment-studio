[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-ops-platform-backend"
version = "0.1.0"
description = "Portfolio Operations Workbench platform entry backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "tushare>=1.4,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
  "xlrd>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["platform_app*"]

[tool.pytest.ini_options]
addopts = "--capture=no tests"
testpaths = ["tests"]

- insert:
    - id: mcp-portfolio-copilot
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: portfolio
        transport: stdio
        command: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_PROJECT_ROOT + '/.venv/bin/python'
        args: ['-m', 'portfolio_app.assistant_mcp']
        cwd: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_PROJECT_ROOT + '/apps/portfolio/backend'
        env:
          INVESTMENT_STUDIO_PORTFOLIO_COPILOT_API_BASE_URL: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_API_BASE_URL ?? 'http://127.0.0.1:8001/api'
          INVESTMENT_STUDIO_PORTFOLIO_COPILOT_PORTFOLIO_ID: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_PORTFOLIO_ID
          INVESTMENT_STUDIO_PORTFOLIO_COPILOT_BATCH_ID: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_BATCH_ID
          INVESTMENT_STUDIO_PORTFOLIO_COPILOT_RUN_TOKEN: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_RUN_TOKEN
          INVESTMENT_STUDIO_PORTFOLIO_COPILOT_MODEL_NAME: !!js process.env.INVESTMENT_STUDIO_PORTFOLIO_COPILOT_MODEL_NAME
        toolCallTimeoutMs: 60000
        failOnStartupError: true

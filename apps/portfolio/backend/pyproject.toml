[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-studio-portfolio-backend"
version = "1.1.0"
description = "Investment Studio Portfolio backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "exchange-calendars>=4.13,<5.0",
  "fastapi>=0.115,<1.0",
  "mcp>=2.0,<3.0",
  "numpy>=1.26,<3.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "scipy>=1.13,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
portfolio-copilot-mcp = "portfolio_app.assistant_mcp:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "httpx2>=2.5,<3.0",
]

[tool.setuptools.packages.find]
include = ["portfolio_app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "migration_base_revision(revision): initializes the isolated test database at an explicit pre-head migration revision",
  "postgresql_integration: exercises PostgreSQL-only schema and constraint behavior",
]
